org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
kotlin.daemon.jvm.options=-Xmx1024m
# System JDK is 26 — AGP (through at least 8.13) chokes on that version string ("26.0.1" as the
# entire error message). Point Gradle at Android Studio's bundled JBR (25) instead.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.13.2 was tested up to compile SDK 36.1; this silences its "unsupported compileSdk" warning.
android.suppressUnsupportedCompileSdk=37,37.0
